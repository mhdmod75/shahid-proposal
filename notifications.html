<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>الإشعارات | منصة شهيد</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-shell" data-tabbar="notifications">
    <header class="app-header">
      <img src="assets/img/logo_new_syria.svg" alt="شعار منصة شهيد" class="app-logo" />
      <div class="app-header-text">
        <p class="brand-tag">منصة شهيد</p>
        <h1>الإشعارات</h1>
      </div>
    </header>

    <main class="app-main">
      <section class="section-heading notifications-heading">
        <p class="eyebrow">من الإدارة</p>
        <h3>آخر التحديثات</h3>
        <p class="section-desc" id="notificationsSummary">—</p>
      </section>

      <div id="notificationsList" class="notifications-list"></div>

      <div class="empty-state hidden" id="emptyNotifications">
        <p>لا توجد إشعارات حالياً. ستظهر هنا أي رسائل أو تحديثات من الإدارة.</p>
      </div>
    </main>
  </div>

  <script src="assets/storage.js"></script>
  <script src="assets/app-tabs.js"></script>
  <script>
    const session = requireAuth();
    const typeMeta = {
      admin: { label: 'إشعار إداري' },
      request: { label: 'طلب تسجيل' },
      interview: { label: 'مقابلة' },
      complaint: { label: 'شكوى' },
    };

    function formatDate(timestamp) {
      return new Date(timestamp).toLocaleDateString('ar-SY', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function renderNotifications() {
      const notifications = getNotifications(session.phone);
      const listEl = document.getElementById('notificationsList');
      const emptyEl = document.getElementById('emptyNotifications');
      const unreadCount = notifications.filter(n => !n.read).length;

      document.getElementById('notificationsSummary').textContent =
        unreadCount === 0
          ? 'جميع الإشعارات مقروءة.'
          : unreadCount === 1
            ? 'لديك إشعار واحد غير مقروء.'
            : `لديك ${unreadCount} إشعارات غير مقروءة.`;

      listEl.innerHTML = '';

      if (notifications.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');

      notifications.forEach(notification => {
        const meta = typeMeta[notification.type] || typeMeta.admin;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `notification-card${notification.read ? '' : ' unread'}`;
        card.innerHTML = `
          <div class="notification-card-top">
            <div class="notification-head">
              <span class="notification-tag">${meta.label}</span>
              <h4>${notification.title}</h4>
            </div>
            ${notification.read ? '' : '<span class="notification-unread-dot" aria-label="غير مقروء"></span>'}
          </div>
          <p class="notification-body">${notification.body}</p>
          <time class="notification-time">${formatDate(notification.createdAt)}</time>
        `;

        card.addEventListener('click', () => {
          markNotificationRead(session.phone, notification.id);
          if (notification.link) {
            window.location.href = notification.link;
            return;
          }
          renderNotifications();
        });

        listEl.appendChild(card);
      });
    }

    renderNotifications();
  </script>
</body>
</html>
