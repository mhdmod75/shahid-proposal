<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | منصة شهيد</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/img/logo_new_syria.svg" alt="شعار منصة شهيد" class="brand-logo" />
        <div>
          <p class="brand-tag">منصة شهيد</p>
          <h1>تسجيل الدخول</h1>
        </div>
      </div>
      <nav class="page-nav" aria-label="التنقل بين الصفحات">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="login.html" class="nav-link active">تسجيل الدخول</a>
        <a href="request.html" class="nav-link">الاستمارة</a>
        <a href="complaint.html" class="nav-link">الشكاوى</a>
        <a href="status.html" class="nav-link">حالة الطلب</a>
      </nav>
    </header>

    <main class="page-center">
      <section class="auth-card">
        <div class="card-top">
          <img src="assets/img/syrian-flag-proportions.svg" alt="علم سوريا" class="flag" />
          <div>
            <p class="card-label">المرحلة الأولى</p>
            <h3>تسجيل الدخول عبر الرقم</h3>
          </div>
        </div>

        <form class="phone-form">
          <label for="phone">رقم الهاتف</label>
          <input id="phone" type="tel" placeholder="09XXXXXXXXX" required />
          <button type="submit" class="btn btn-primary wide">إرسال رمز التحقق</button>
        </form>

        <div class="otp-box" aria-live="polite">
          <p class="otp-notice">سيتم إرسال رمز مكون من 6 أرقام عبر الرسائل القصيرة. بعد التحقق يتم التسجيل بنجاح داخل النظام.</p>
          <label for="otp">رمز التحقق</label>
          <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" />
          <button type="button" class="btn btn-secondary wide">تأكيد الرمز</button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
