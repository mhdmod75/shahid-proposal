<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>تسجيل الدخول | منصة شهيد</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-shell">
    <header class="app-header">
      <img src="assets/img/logo_new_syria.svg" alt="شعار منصة شهيد" class="app-logo" />
      <div class="app-header-text">
        <p class="brand-tag">منصة شهيد</p>
        <h1>تسجيل الدخول</h1>
      </div>
    </header>

    <main class="app-main">
      <section class="auth-card app-card">
        <div class="card-top">
          <img src="assets/img/syrian-flag-proportions.svg" alt="علم سوريا" class="flag" />
          <div>
            <p class="card-label">الخطوة الأولى</p>
            <h3>أدخل رقم جوالك</h3>
          </div>
        </div>

        <form class="phone-form">
          <label for="phone">رقم الموبايل السوري</label>
          <input id="phone" type="tel" placeholder="09XXXXXXXXX" required />
          <button type="submit" class="btn btn-primary wide">إرسال رمز التحقق</button>
        </form>

        <div class="otp-box hidden" aria-live="polite">
          <p class="otp-notice">سيتم إرسال رمز مكون من 6 أرقام عبر الرسائل القصيرة.</p>
          <label for="otp">رمز التحقق</label>
          <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" />
          <button type="button" id="otpConfirm" class="btn btn-primary wide">تأكيد الرمز والدخول</button>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/storage.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
