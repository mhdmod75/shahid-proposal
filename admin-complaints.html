<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الشكاوى | منصة شهيد</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-shell admin-shell">
    <header class="app-header">
      <a href="index.html" class="app-back" aria-label="العودة">→</a>
      <div class="app-header-text">
        <p class="brand-tag">عرض للعميل</p>
        <h1>لوحة إدارة الشكاوى</h1>
      </div>
    </header>

    <main class="app-main">
      <section class="section-heading">
        <p class="eyebrow">الإدارة</p>
        <h3>جميع الشكاوى</h3>
        <p class="section-desc">يمكن للإدارة الرد على الشكاوى وإغلاقها يدوياً فقط بحالة «تمت المعالجة» أو «مرفوضة».</p>
      </section>

      <div id="adminComplaintsList" class="complaints-list"></div>

      <section class="form-card app-card hidden" id="adminDetailSection">
        <div class="complaint-list-head">
          <strong id="adminComplaintId">—</strong>
          <span id="adminComplaintStatus"></span>
        </div>
        <p class="section-desc" id="adminComplaintMeta">—</p>

        <div id="adminReplyThread" class="admin-thread-wrap"></div>

        <form class="request-form hidden" id="adminReplyForm">
          <div class="form-grid form-grid-single">
            <label><span>رد الإدارة</span>
              <textarea name="body" placeholder="اكتب رد الإدارة" required rows="4"></textarea>
            </label>
            <label><span>مرفق (ملف واحد فقط)</span>
              <input type="file" id="adminReplyAttachment" accept="image/*,.pdf" />
            </label>
          </div>
          <div class="form-actions admin-close-actions">
            <button type="submit" class="btn btn-primary">إرسال الرد</button>
            <button type="button" class="btn btn-secondary" id="resolveBtn">تمت المعالجة</button>
            <button type="button" class="btn btn-danger" id="rejectBtn">مرفوضة</button>
          </div>
        </form>

        <div class="complaint-closed-banner hidden" id="adminClosedBanner">
          <p id="adminClosedBannerText">—</p>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/storage.js"></script>
  <script src="assets/form-fields.js"></script>
  <script src="assets/complaints.js"></script>
  <script>
    let activeComplaintId = null;
    const listEl = document.getElementById('adminComplaintsList');
    const detailSection = document.getElementById('adminDetailSection');
    const replyForm = document.getElementById('adminReplyForm');
    const closedBanner = document.getElementById('adminClosedBanner');

    initFormEnhancements(replyForm);

    function renderAdminList() {
      const complaints = getAllComplaints().sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
      listEl.innerHTML = complaints.length
        ? complaints.map(complaint => `
          <button type="button" class="complaint-list-card complaint-list-button${complaint.id === activeComplaintId ? ' active' : ''}" data-id="${complaint.id}">
            <div class="complaint-list-head">
              <strong>${complaint.id}</strong>
              ${renderComplaintStatusBadge(complaint.status)}
            </div>
            <p class="complaint-list-preview">${escapeHtml(complaint.replies?.[0]?.body?.slice(0, 90) || '—')}</p>
            <p class="complaint-list-meta">مقدم الطلب: ${complaint.phone}</p>
          </button>
        `).join('')
        : '<p class="section-desc">لا توجد شكاوى حالياً.</p>';

      listEl.querySelectorAll('[data-id]').forEach(button => {
        button.addEventListener('click', () => openComplaint(button.dataset.id));
      });
    }

    function openComplaint(complaintId) {
      activeComplaintId = complaintId;
      const complaint = getComplaint(complaintId);
      if (!complaint) return;

      detailSection.classList.remove('hidden');
      document.getElementById('adminComplaintId').textContent = complaint.id;
      document.getElementById('adminComplaintStatus').innerHTML = renderComplaintStatusBadge(complaint.status);
      document.getElementById('adminComplaintMeta').textContent =
        `مقدم الطلب: ${complaint.phone} · ${formatComplaintDate(complaint.createdAt)}`;

      document.getElementById('adminReplyThread').innerHTML = renderReplyThread(complaint.replies);

      if (complaint.status === COMPLAINT_STATUS.OPEN) {
        replyForm.classList.remove('hidden');
        closedBanner.classList.add('hidden');
      } else {
        replyForm.classList.add('hidden');
        closedBanner.classList.remove('hidden');
        document.getElementById('adminClosedBannerText').textContent =
          complaint.status === COMPLAINT_STATUS.RESOLVED
            ? 'تمت معالجة الشكوى وإغلاقها.'
            : 'تم رفض الشكوى وإغلاقها.';
        closedBanner.className = `complaint-closed-banner banner-${complaint.status}`;
      }

      renderAdminList();
    }

    replyForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!activeComplaintId) return;

      const body = replyForm.body.value.trim();
      if (!body) return;

      addComplaintReply(activeComplaintId, {
        author: 'admin',
        body,
        attachmentName: readSingleAttachment(document.getElementById('adminReplyAttachment')),
      });

      replyForm.reset();
      openComplaint(activeComplaintId);
    });

    document.getElementById('resolveBtn').addEventListener('click', () => {
      if (!activeComplaintId) return;
      closeComplaint(activeComplaintId, COMPLAINT_STATUS.RESOLVED);
      openComplaint(activeComplaintId);
    });

    document.getElementById('rejectBtn').addEventListener('click', () => {
      if (!activeComplaintId) return;
      closeComplaint(activeComplaintId, COMPLAINT_STATUS.REJECTED);
      openComplaint(activeComplaintId);
    });

    renderAdminList();
  </script>
</body>
</html>
