<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>الشكاوى | منصة شهيد</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-shell" data-tabbar="complaint">
    <header class="app-header">
      <img src="assets/img/logo_new_syria.svg" alt="شعار منصة شهيد" class="app-logo" />
      <div class="app-header-text">
        <p class="brand-tag">منصة شهيد</p>
        <h1>الشكاوى</h1>
      </div>
    </header>

    <main class="app-main">
      <section class="section-heading">
        <p class="eyebrow">مسار مستقل</p>
        <h3>شكاويي</h3>
        <p class="section-desc">يمكنك متابعة المحادثة مع الإدارة على كل شكوى. لا تُغلق الشكوى إلا يدوياً من قبل الإدارة.</p>
        <p class="section-desc demo-admin-link"><a href="admin-complaints.html">لوحة الإدارة (للعرض)</a></p>
      </section>

      <div id="complaintsList" class="complaints-list"></div>

      <div class="empty-state hidden" id="emptyComplaints">
        <div class="empty-icon">✉️</div>
        <p>لم تُقدّم أي شكوى بعد. استخدم الزر أدناه لبدء شكوى جديدة.</p>
      </div>

      <section class="form-card app-card" id="newComplaintSection">
        <div class="section-heading">
          <h3 id="newComplaintTitle">شكوى جديدة</h3>
        </div>

        <form class="request-form" id="complaintForm">
          <div class="form-grid form-grid-single">
            <label><span>نص الشكوى</span>
              <textarea name="details" placeholder="يرجى توضيح المشكلة التي تريد رفعها" required rows="5"></textarea>
            </label>
            <label><span>مرفق (ملف واحد فقط)</span>
              <input type="file" id="complaintAttachment" accept="image/*,.pdf" />
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary wide">إرسال الشكوى</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="assets/storage.js"></script>
  <script src="assets/form-fields.js"></script>
  <script src="assets/complaints.js"></script>
  <script src="assets/app-tabs.js"></script>
  <script>
    const session = requireAuth();
    const listEl = document.getElementById('complaintsList');
    const emptyEl = document.getElementById('emptyComplaints');
    const form = document.getElementById('complaintForm');

    initFormEnhancements(form);

    function renderComplaints() {
      const complaints = getComplaints(session.phone);
      listEl.innerHTML = '';

      if (complaints.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      complaints.forEach(complaint => {
        listEl.insertAdjacentHTML('beforeend', renderComplaintListItem(complaint));
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const details = form.details.value.trim();
      if (!details) return;

      const attachmentName = readSingleAttachment(document.getElementById('complaintAttachment'));
      const complaint = createComplaint(session.phone, details, attachmentName);
      window.location.href = 'complaint-detail.html?id=' + complaint.id;
    });

    renderComplaints();
  </script>
</body>
</html>
