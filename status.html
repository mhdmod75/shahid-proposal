<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>حالة الطلب | منصة شهيد</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="app-body">
  <div class="app-shell">
    <header class="app-header">
      <a href="home.html" class="app-back" aria-label="العودة">→</a>
      <div class="app-header-text">
        <p class="brand-tag">منصة شهيد</p>
        <h1>حالة الطلب</h1>
      </div>
    </header>

    <main class="app-main">
      <section class="status-card app-card">
        <div class="section-heading">
          <p class="eyebrow" id="statusEyebrow">تم الإرسال بنجاح</p>
          <h3 id="statusTitle">مراجعة الطلب</h3>
        </div>

        <div class="status-box">
          <p><strong>رقم الطلب:</strong> <span id="requestId">—</span></p>
          <p><strong>الحالة:</strong> <span id="requestStatus">قيد الدراسة الإداريّة</span></p>
          <p id="requestNotes"><strong>ملاحظات:</strong> سيتم دراسة طلب التسجيل، وفي حال القبول سيتم تحويل الطلب إلى مرحلة المقابلة.</p>
          <p id="requestOutcome"><strong>النتيجة المتوقعة:</strong> قبول / رفض / تحويل إلى مقابلة.</p>
        </div>

        <div class="form-actions">
          <a href="home.html" class="btn btn-primary wide">العودة للرئيسية</a>
          <a href="martyr-form.html" class="btn btn-secondary wide" id="addMartyrAction">إضافة شهيد آخر</a>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/storage.js"></script>
  <script>
    requireAuth();
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'M-demo-1';
    const isComplaint = id.startsWith('C-');
    document.getElementById('requestId').textContent = id;

    if (isComplaint) {
      document.getElementById('statusEyebrow').textContent = 'تم إرسال الشكوى';
      document.getElementById('statusTitle').textContent = 'متابعة الشكوى';
      document.getElementById('requestStatus').textContent = 'قيد الدراسة';
      document.getElementById('requestNotes').innerHTML =
        '<strong>ملاحظات:</strong> سيتم دراسة الشكوى وإحالتها إلى الجهة المختصة عند الحاجة.';
      document.getElementById('requestOutcome').innerHTML =
        '<strong>النتيجة المتوقعة:</strong> قبول / رفض / إحالة.';
      document.getElementById('addMartyrAction').classList.add('hidden');
    }
  </script>
</body>
</html>
